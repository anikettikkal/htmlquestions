<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css practice</title>
    <style>
       .box{
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-evenly;
       }
       .container {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr; /* 3 columns with fractional units */
  grid-template-rows: 100px auto;    /* 2 rows, first 100px, second automatic */
}

    </style>
</head>
<body>
    <h1>aniket</h1>
    <div class="box">
        <h2 class="item">aniket</h2>
        <h2 class="item">aniket</h2>
        <h2 class="item">aniket</h2>
        <h2 class="item">aniket</h2>
    </div>
    <div class="container">
        <h1>aniket</h1>
        <h2>aniket</h2>
        <h2>aniket</h2>
        <h2>aniket</h2>
        <h2>aniket</h2>

    </div>
</body>
</html>
