<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Interview Practice</title>
</head>
<body>
    <!-- semantic tags -->
    <header></header>
    <footer></footer>
    <nav></nav>
    <article>aniket</article>

    <!-- block level elements -->
    <div></div> <p></p>
    <!-- inline elements -->
    <span></span> <a href="#"></a>

    <!-- global attributes -->
    <div id="uniqueId" style="font-size:200px;" class="myClass" title="This is a div">Aniket</div>

    <!-- Purpose of alt attribute in <img> -->
    <img src="" alt="">Provides alternative text if the image doesn’t load

    <!-- strong and b tag i and em -->
    <b>aniket</b>
    <em>aniket</em>
    <strong>Aniket</strong>
    <i>aniket</i>

    <!-- ol list -->
    <ol type="I">
        <li>aniket</li>
        <li>ramesh</li>
        <li>tikkal</li>
    </ol>

    <!-- ul list -->
    <ul type="square">
        <li>aniket</li>
        <li>mukesh</li>
        <li>sakshi</li>
        <li>avi</li>
    </ul>

</body>
</html>
