<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS questions</title>
    <style>
        * {
            background-color: black;
            color: white;
        }

        .box-model {
            width: 200px;
            height: 100px;
            padding: 20px;
            border: 5px solid black;
            margin: 15px;
            background-color: lightblue;
            border-radius: 20px;
        }

        .center-element {
            width: 200px;
            margin: 0 auto;
        }

        .box {
            width: 120px;
            height: 120px;
            background: lightblue;
            padding: 10px;
        }

        .left {
            float: right;
            margin-right: 15px;
        }

        .flex-box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            margin: 10px;
        }

        .main-div {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* 3 equal columns */
            gap: 10px;
        }

        .item {
            background: lightgreen;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <!-- What is the CSS box model? -->
    padding,margin,border,content
    <h1 class="box-model">CSS BOX MODEL</h1>

    <!-- What is the universal selector? -->
    The universal selector (*) selects all elements on the page.

    <!-- How to center a block element horizontally? -->
    <h1 class="center-element">Aniket</h1>


    <!-- float example -->
    <div>
        <div class="box left">Left Box</div>
        <p>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. This text will wrap
            around the floated box.
        </p>
    </div> <br>


    <!-- flex boxes example -->
    <div class="main-div">
        <div class="flex-box"></div>
        <div class="flex-box"></div>
        <div class="flex-box"></div>
        <div class="flex-box"></div>
    </div>

    <!-- css grid example -->
    <div class="grid-container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>


</body>

</html>
