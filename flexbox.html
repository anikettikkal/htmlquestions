<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            background-color: lightblue;
            border: 2px solid black;
            display: flex;
            justify-content: center;  /* horizontal center */
            align-items: center;      /* vertical center */      
            border-radius: 10px;
            margin: 10px;
        }
        .container{
            display: flex;
            justify-content:space-around;
            align-items: center;
            flex-wrap: wrap;
        }
        .content{
            height: 100px;
            width: 300px;
            background-color: lightgreen;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            border: 2px solid black;
            border-radius: 10px;
            margin: 20px;
        }
        .major{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .aniket{
            height: 100px;
            width: 300px;
            background-color: lightgreen;
            
            font-size: 30px;
            font-weight: bold;
            border: 2px solid black;
            border-radius: 10px;
            margin: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .parent{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .text{
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <!-- <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div> -->

    <div class="major">
        <div class="content">Aniket</div>
    </div>
    <div class="parent">
        <div class="aniket">aniket</div>
    </div>

    <h1 class="text">text</h1>
</body>

</html>
