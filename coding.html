<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html coding round questions</title>
    <style>
        .main-div {
            display: flex;
            justify-content: space-between;
        }

        .child {
            height: 200px;
            width: 300px;
            background-color: lightgreen;
            border: 2px solid black;
            margin: 10px;
            text-align: center;
            box-shadow: 2px 2px 5px gray;
        }

        .grid-parent {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid-child {
            height: 200px;
            width: 300px;
            background-color: lightblue;
            border: 2px solid black;
            margin: 10px;
            text-align: center;
            box-shadow: 2px 2px 5px gray;
        }

        @media (max-width: 600px) {
            .grid-parent {
                grid-template-columns: 1fr;
                /* 1 column */
            }
        }

        /* FIXED HEADER */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
            z-index: 1000;
        }

        /* PAGE LAYOUT */
        .container {
            display: flex;
            margin-top: 70px;
            /* Prevent overlap with fixed header */
        }

        /* STICKY SIDEBAR */
        .sidebar {
            position: sticky;
            top: 70px;
            /* Same as header height */
            width: 200px;
            height: max-content;
            background: #f0f0f0;
            padding: 20px;
            border-right: 1px solid #ccc;
        }

        .sidebar ul li {
            margin-bottom: 15px;
        }

        /* MAIN CONTENT */
        .content {
            flex: 1;
            padding: 20px;
        }

        .btn {
            background-color: blue;
            color: white;
            height: 40px;
            width: 100px;
            border: 2px solid black;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            font-size: larger;
            font-weight: bold;
            display: flex;
            margin-left: auto;
            margin-right: auto;
            align-items: center;
            /* vertical */
            justify-content: center;
        }

        .btn:hover {
            cursor: pointer;
            background-color: black;
            transition: all 0.3s ease-in-out;
        }
        .center-div{
            height: 200px;
            width: 300px;
            text-align: center;
            border: 2px solid black;
            background-color: lightskyblue;
        }
        .center-div{
            display: grid;
            place-items: center;
        }
    </style>
</head>

<body>
    1. Create a form with validation (name, email, password)
    <form action="">
        <label for="name">name<input type="text" placeholder="name"></label>
        <br>
        <label for="email">email<input type="email" placeholder="email" required></label>
        <br>
        <label for="password">password<input type="password" minlength="6" maxlength="20" pattern=""
                placeholder="password" required></label>
        <br>
        <input type="submit" value="submit">
    </form>

    <!-- 2. Build a table of student data using HTML -->
    <table border="1">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Apple</td>
                <td>$2</td>
            </tr>
            <tr>
                <td>Banana</td>
                <td>$1</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>$3</td>
            </tr>
        </tfoot>
    </table>


    <!-- 3.create a responsive navbar using HTML and CSS -->
    <nav>
        <ul style="list-style-type:none; display:flex; background-color:lightgray; padding:10px;">
            <li style="margin-right:20px;"><a href="#home">Home</a></li>
            <li style="margin-right:20px;"><a href="#about">About</a></li>
            <li style="margin-right:20px;"><a href="#services">Services</a></li>
            <li style="margin-right:20px;"><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    css question start
    <!-- 6. Create a 3-column layout using Flexbox -->
    <div class="main-div">
        <div class="child">one</div>
        <div class="child">two</div>
        <div class="child">three</div>
    </div>

    <!-- 7. Create a CSS Grid layout of 6 boxes (2 rows × 3 columns) -->
    <div class="grid-parent">
        <div class="grid-child">one</div>
        <div class="grid-child">two</div>
        <div class="grid-child">three</div>
        <div class="grid-child">four</div>
        <div class="grid-child">five</div>
        <div class="grid-child">six</div>
    </div>


    <!-- 9. Create a fixed header and sticky sidebar using CSS

    Scrolling should keep the sidebar sticky. -->

    <header class="header">
        <h2>My Website</h2>
    </header>

    <div class="container">
        <aside class="sidebar">
            <ul>
                <li>Dashboard</li>
                <li>Profile</li>
                <li>Settings</li>
                <li>Logout</li>
            </ul>
        </aside>
    </div>


    <button class="btn">Submit</button>

    <!-- 10. Center a box inside the page horizontally and vertically

    (Required in almost every coding test) -->

    <div class="center-div">
        <h1 style="text-align: center;">ANIKET</h1>
    </div>
</body>

</html>
